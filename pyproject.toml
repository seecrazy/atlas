[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-project-knowledge"
version = "0.2.0"
description = "Layered project knowledge indexing and MCP server for very large codebases"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
production = [
  "tree-sitter-language-pack>=0.9.0",
  "watchfiles>=1.1.0",
]
watch = [
  "watchfiles>=1.1.0",
]
deep-parser = [
  "tree-sitter-language-pack>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
atlas = "atlas.cli:main"
atlas-mcp = "atlas.mcp:main"
atlas-http = "atlas.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["data/*.json"]

